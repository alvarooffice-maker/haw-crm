name: Supabase Keep-Alive

on:
  schedule:
    # Roda toda segunda e quinta às 10h UTC (7h Brasília) para evitar pause de 7 dias
    - cron: '0 10 * * 1,4'
  workflow_dispatch: # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/usuarios?select=id&limit=1")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Supabase está ativo."
          else
            echo "AVISO: Supabase retornou $STATUS"
            exit 1
          fi
