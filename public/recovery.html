<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HAW Vision — Abrindo…</title>
<style>
  body{margin:0;background:#13182C;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif}
  .box{text-align:center;color:#fff}
  .logo{color:#F7CF13;font-size:36px;font-weight:800;margin-bottom:8px}
  .msg{color:#aaa;font-size:14px}
  .spin{font-size:32px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin">⚙️</div>
  <div class="logo">HAW Vision</div>
  <div class="msg" id="msg">Preparando acesso…</div>
</div>
<script>
(async function(){
  const msg = document.getElementById('msg');

  // 1. Gravar sessão e usuários ANTES de qualquer coisa
  const session = JSON.stringify({id:'u1',nome:'Dono HAW',perfil:'dono',initials:'DH'});
  sessionStorage.setItem('haw_session', session);

  try {
    const raw = localStorage.getItem('haw_crm_v1');
    const db  = raw ? JSON.parse(raw) : {};
    db.usuarios = [
      {id:'u1',nome:'Dono HAW',  email:'dono@hawoticas.com.br',  perfil:'dono',     ativo:true,meta:0,    senha:'1234',createdAt:'2024-01-01T00:00:00.000Z'},
      {id:'u2',nome:'Ana Lima',  email:'ana@hawoticas.com.br',   perfil:'vendedor', ativo:true,meta:8000, senha:'1111',createdAt:'2024-01-01T00:00:00.000Z'},
      {id:'u3',nome:'Carlos Souza',email:'carlos@hawoticas.com.br',perfil:'vendedor',ativo:true,meta:7000,senha:'2222',createdAt:'2024-01-01T00:00:00.000Z'}
    ];
    localStorage.setItem('haw_crm_v1', JSON.stringify(db));
  } catch(e) {}

  // 2. Buscar index.html
  msg.textContent = 'Carregando sistema…';
  let html;
  try {
    const r = await fetch('index.html?_=' + Date.now());
    html = await r.text();
  } catch(e) {
    msg.textContent = 'Erro ao carregar app: ' + e.message;
    return;
  }

  // 3. Injetar script ANTES de qualquer outro script do index.html
  //    Esse script roda imediatamente e garante sessionStorage + localStorage corretos
  const inject = `<script>
(function(){
  var s='{"id":"u1","nome":"Dono HAW","perfil":"dono","initials":"DH"}';
  try{sessionStorage.setItem('haw_session',s);}catch(e){}
  try{
    var raw=localStorage.getItem('haw_crm_v1');
    var db=raw?JSON.parse(raw):{};
    if(!db.usuarios||!db.usuarios.length){
      db.usuarios=[
        {id:'u1',nome:'Dono HAW',email:'dono@hawoticas.com.br',perfil:'dono',ativo:true,meta:0,senha:'1234'},
        {id:'u2',nome:'Ana Lima',email:'ana@hawoticas.com.br',perfil:'vendedor',ativo:true,meta:8000,senha:'1111'},
        {id:'u3',nome:'Carlos Souza',email:'carlos@hawoticas.com.br',perfil:'vendedor',ativo:true,meta:7000,senha:'2222'}
      ];
      localStorage.setItem('haw_crm_v1',JSON.stringify(db));
    }
  }catch(e){}
})();
<\/script>`;

  // Inserir logo após <head> (antes de qualquer outro script)
  const modified = html.replace('<head>', '<head>' + inject);

  // 4. Substituir o documento atual pelo index.html modificado
  //    (mesma origem → sessionStorage/localStorage preservados)
  msg.textContent = 'Abrindo…';
  document.open('text/html','replace');
  document.write(modified);
  document.close();
})();
</script>
</body>
</html>
