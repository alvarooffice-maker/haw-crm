<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HAW Vision — Recuperação de Acesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#13182C;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;padding:20px}
  .card{background:#1e2640;border-radius:14px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
  .logo{color:#F7CF13;font-size:28px;font-weight:800;margin-bottom:4px}
  .sub{color:#aaa;font-size:12px;margin-bottom:24px}
  .user-btn{width:100%;background:#13182C;border:1px solid #2e3a55;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s}
  .user-btn:hover{border-color:#F7CF13}
  .avatar{width:38px;height:38px;border-radius:50%;background:#F7CF13;color:#13182C;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .user-info{text-align:left}
  .user-name{color:#fff;font-weight:600;font-size:14px}
  .user-role{color:#aaa;font-size:11px}
  .divider{border:none;border-top:1px solid #2e3a55;margin:20px 0}
  .note{color:#666;font-size:11px;line-height:1.6}
  #pin-section{display:none;margin-top:4px}
  .section-title{color:#fff;font-size:14px;font-weight:700;text-align:left;margin-bottom:14px}
  .field-label{color:rgba(255,255,255,.55);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;text-align:left;margin-bottom:6px}
  .field-input{width:100%;padding:12px 14px;background:#13182C;border:1px solid #2e3a55;border-radius:8px;color:#fff;font-size:20px;letter-spacing:.4em;text-align:center;font-weight:700;margin-bottom:14px;outline:none;transition:border-color .2s}
  .field-input:focus{border-color:#F7CF13}
  .btn-gold{width:100%;padding:13px;background:#F7CF13;color:#13182C;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
  .btn-ghost{width:100%;padding:11px;background:transparent;color:#aaa;border:1px solid #2e3a55;border-radius:8px;font-size:13px;cursor:pointer}
  .msg{font-size:12px;margin-top:10px;min-height:16px}
  .msg.ok{color:#2ecc71}.msg.err{color:#e74c3c}
  .selected-box{background:#13182C;border:1px solid #F7CF13;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .selected-box .user-name{color:#F7CF13}
  #loading{color:#aaa;font-size:13px;padding:12px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">HAW Vision</div>
  <div class="sub" id="card-sub">Selecione o usuário para redefinir o PIN</div>

  <div id="loading">⏳ Carregando usuários…</div>
  <div id="user-list" style="display:none"></div>

  <div id="pin-section">
    <div id="selected-display" class="selected-box"></div>
    <div class="section-title">Definir novo PIN</div>
    <label class="field-label">Novo PIN (4 dígitos)</label>
    <input class="field-input" id="new-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <label class="field-label">Confirmar PIN</label>
    <input class="field-input" id="new-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="btn-gold" onclick="salvarPin()">💾 Salvar PIN e Entrar</button>
    <button class="btn-ghost" onclick="voltarLista()">← Voltar</button>
    <div class="msg" id="msg"></div>
  </div>

  <hr class="divider">
  <div class="note">Redefina o PIN de qualquer usuário ativo.<br>A alteração é salva no banco de dados.</div>
</div>

<script>
let selectedUser = null;
let sbClient = null;

function initials(nome) {
  return (nome || '').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
}

async function loadUsuarios() {
  const cfg = window.HAW_CONFIG || {};
  let users = [];

  if (cfg.supabaseUrl && cfg.supabaseKey && !cfg.supabaseUrl.includes('SEU-PROJETO')) {
    try {
      sbClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      const { data, error } = await sbClient.from('usuarios').select('id,nome,perfil,ativo,email').eq('ativo', true);
      if (!error && data && data.length > 0) {
        users = data;
      }
    } catch(e) {}
  }

  // Fallback: lê do localStorage
  if (!users.length) {
    try {
      const raw = localStorage.getItem('haw_crm_v1');
      const db = raw ? JSON.parse(raw) : {};
      if (Array.isArray(db.usuarios) && db.usuarios.length) {
        users = db.usuarios.filter(u => u.ativo !== false);
      }
    } catch(e) {}
  }

  // Fallback final: defaults
  if (!users.length) {
    users = [
      {id:'u1',nome:'Dono HAW',perfil:'dono',ativo:true},
      {id:'u2',nome:'Ana Lima',perfil:'vendedor',ativo:true},
      {id:'u3',nome:'Carlos Souza',perfil:'vendedor',ativo:true},
    ];
  }

  renderUsuarios(users);
}

function renderUsuarios(users) {
  document.getElementById('loading').style.display = 'none';
  const list = document.getElementById('user-list');
  const colors = ['#F7CF13','#4a90d9','#27ae60','#e67e22','#9b59b6'];
  list.innerHTML = users.map((u, i) => {
    const ini = initials(u.nome);
    const bg = colors[i % colors.length];
    const tc = i === 0 ? '#13182C' : '#fff';
    return `<button class="user-btn" onclick='selecionarUsuario(${JSON.stringify(u)})'>
      <div class="avatar" style="background:${bg};color:${tc}">${ini}</div>
      <div class="user-info">
        <div class="user-name">${u.nome}</div>
        <div class="user-role">${u.perfil}</div>
      </div>
    </button>`;
  }).join('');
  list.style.display = 'block';
}

function selecionarUsuario(u) {
  selectedUser = u;
  const ini = initials(u.nome);
  document.getElementById('user-list').style.display = 'none';
  document.getElementById('card-sub').textContent = 'Redefina o PIN de acesso';
  document.getElementById('selected-display').innerHTML = `
    <div class="avatar">${ini}</div>
    <div class="user-info"><div class="user-name">${u.nome}</div><div class="user-role">${u.perfil}</div></div>`;
  document.getElementById('pin-section').style.display = 'block';
  document.getElementById('new-pin').focus();
}

function voltarLista() {
  selectedUser = null;
  document.getElementById('pin-section').style.display = 'none';
  document.getElementById('user-list').style.display = 'block';
  document.getElementById('card-sub').textContent = 'Selecione o usuário para redefinir o PIN';
  document.getElementById('msg').textContent = '';
  document.getElementById('new-pin').value = '';
  document.getElementById('new-pin2').value = '';
}

async function salvarPin() {
  const pin  = document.getElementById('new-pin').value.trim();
  const pin2 = document.getElementById('new-pin2').value.trim();
  const msg  = document.getElementById('msg');

  if (!/^\d{4}$/.test(pin)) {
    msg.className = 'msg err'; msg.textContent = 'PIN deve ter exatamente 4 dígitos numéricos.'; return;
  }
  if (pin !== pin2) {
    msg.className = 'msg err'; msg.textContent = 'Os PINs não coincidem.'; return;
  }

  msg.className = 'msg'; msg.textContent = '⏳ Salvando…';

  const u = selectedUser;

  // 1. Grava em haw_pins — chave usada pelo doLogin(), nunca tocada pelo Supabase
  try {
    const p = JSON.parse(localStorage.getItem('haw_pins') || '{}');
    p[u.nome] = pin;
    localStorage.setItem('haw_pins', JSON.stringify(p));
  } catch(e) {}

  // 2. Atualiza localStorage haw_crm_v1
  try {
    const raw = localStorage.getItem('haw_crm_v1');
    const db  = raw ? JSON.parse(raw) : {};
    if (!Array.isArray(db.usuarios)) db.usuarios = [];
    const idx = db.usuarios.findIndex(x => x.id === u.id || x.nome === u.nome);
    if (idx >= 0) {
      db.usuarios[idx].senha = pin;
    } else {
      db.usuarios.push({...u, senha: pin, ativo: true});
    }
    localStorage.setItem('haw_crm_v1', JSON.stringify(db));
  } catch(e) {}

  // 3. Atualiza Supabase (por ID real)
  let sbOk = false;
  if (sbClient) {
    try {
      const { error } = await sbClient.from('usuarios').update({ senha: pin }).eq('id', u.id);
      if (!error) sbOk = true;
    } catch(e) {}
  }

  // 4. Grava sessão com ID real e redireciona
  const ini = initials(u.nome);
  const session = { id: u.id, nome: u.nome, perfil: u.perfil, initials: ini };
  sessionStorage.setItem('haw_session', JSON.stringify(session));

  msg.className = 'msg ok';
  msg.textContent = sbOk ? '✅ PIN salvo no banco e localmente! Abrindo…' : '✅ PIN salvo localmente! Abrindo…';

  setTimeout(() => { window.location.href = 'index.html'; }, 1200);
}

// Inicia
loadUsuarios();
</script>
</body>
</html>
