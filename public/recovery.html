<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HAW Vision — Acesso</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#13182C;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;padding:20px}
  .card{background:#1e2640;border-radius:14px;padding:36px 32px;width:100%;max-width:360px;text-align:center}
  .logo{color:#F7CF13;font-size:28px;font-weight:800;margin-bottom:4px}
  .sub{color:#aaa;font-size:12px;margin-bottom:28px}
  .user-btn{width:100%;background:#13182C;border:1px solid #2e3a55;border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s}
  .user-btn:hover{border-color:#F7CF13}
  .avatar{width:38px;height:38px;border-radius:50%;background:#F7CF13;color:#13182C;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .user-info{text-align:left}
  .user-name{color:#fff;font-weight:600;font-size:14px}
  .user-role{color:#aaa;font-size:11px}
  .msg{color:#aaa;font-size:12px;margin-top:16px}
  .spin{display:none;color:#F7CF13;font-size:14px;margin-top:16px}
  .divider{border:none;border-top:1px solid #2e3a55;margin:20px 0}
  .note{color:#666;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">HAW Vision</div>
  <div class="sub">Acesso temporário — selecione seu usuário</div>

  <button class="user-btn" onclick="entrar('u1','Dono HAW','dono','DH')">
    <div class="avatar">DH</div>
    <div class="user-info"><div class="user-name">Dono HAW</div><div class="user-role">Dono · Acesso total</div></div>
  </button>

  <button class="user-btn" onclick="entrar('u2','Ana Lima','vendedor','AL')">
    <div class="avatar" style="background:#4a90d9">AL</div>
    <div class="user-info"><div class="user-name">Ana Lima</div><div class="user-role">Vendedor · Vendas e clientes</div></div>
  </button>

  <button class="user-btn" onclick="entrar('u3','Carlos Souza','vendedor','CS')">
    <div class="avatar" style="background:#27ae60">CS</div>
    <div class="user-info"><div class="user-name">Carlos Souza</div><div class="user-role">Vendedor · Vendas e clientes</div></div>
  </button>

  <div class="spin" id="spin">⏳ Abrindo sistema…</div>

  <hr class="divider">
  <div class="note">
    Use esta página enquanto o sistema atualiza.<br>
    Quando aparecer <strong style="color:#F7CF13">v2</strong> no título da aba, o PIN normal volta a funcionar.
  </div>
</div>

<script>
const USERS = {
  u1:{id:'u1',nome:'Dono HAW',  email:'dono@hawoticas.com.br',  perfil:'dono',     ativo:true,meta:0,    senha:'1234'},
  u2:{id:'u2',nome:'Ana Lima',  email:'ana@hawoticas.com.br',   perfil:'vendedor', ativo:true,meta:8000, senha:'1111'},
  u3:{id:'u3',nome:'Carlos Souza',email:'carlos@hawoticas.com.br',perfil:'vendedor',ativo:true,meta:7000,senha:'2222'}
};

async function entrar(id, nome, perfil, initials){
  document.getElementById('spin').style.display='block';

  // 1. Gravar sessão
  const session = {id, nome, perfil, initials};
  sessionStorage.setItem('haw_session', JSON.stringify(session));

  // 2. Gravar usuários no localStorage
  try {
    const raw = localStorage.getItem('haw_crm_v1');
    const db  = raw ? JSON.parse(raw) : {};
    db.usuarios = Object.values(USERS);
    localStorage.setItem('haw_crm_v1', JSON.stringify(db));
  } catch(e) {}

  // 3. Buscar index.html e injetar bypass no <head>
  try {
    const r = await fetch('index.html?_=' + Date.now());
    const html = await r.text();

    const sessionStr = JSON.stringify(session).replace(/'/g,"\\'");
    const inject = `<script>(function(){
      try{sessionStorage.setItem('haw_session','${sessionStr.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}');}catch(e){}
      try{
        var raw=localStorage.getItem('haw_crm_v1');
        var db=raw?JSON.parse(raw):{};
        if(!db.usuarios||!db.usuarios.length){
          db.usuarios=${JSON.stringify(Object.values(USERS))};
          localStorage.setItem('haw_crm_v1',JSON.stringify(db));
        }
      }catch(e){}
    })();<\/script>`;

    const modified = html.replace('<head>', '<head>' + inject);
    document.open('text/html','replace');
    document.write(modified);
    document.close();
  } catch(e) {
    document.getElementById('spin').textContent = 'Erro: ' + e.message;
  }
}
</script>
</body>
</html>
